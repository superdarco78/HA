name: 🚀 Wydania kart

# Gdy w CHANGELOG.md karty pojawi się nowa wersja (pierwszy nagłówek „## vNN”),
# powstaje wydanie „<karta>-vNN” z plikiem .js i opisem zmian.
on:
  push:
    branches: [main]
    paths: ['**/CHANGELOG.md', '**/*.js', '.github/workflows/release.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Utwórz brakujące wydania
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Wydania kart, których folderu już nie ma w repo, są usuwane.
          for tag in $(gh release list --limit 200 --json tagName --jq '.[].tagName'); do
            card=${tag%-v*}
            if ! ls */"$card"/CHANGELOG.md >/dev/null 2>&1; then gh release delete "$tag" --cleanup-tag -y; echo "🗑 $tag"; fi
          done
          for log in */*/CHANGELOG.md; do
            dir=$(dirname "$log"); card=$(basename "$dir")
            ver=$(grep -m1 -oE '^## v[0-9]+(\.[0-9]+)*' "$log" | cut -c4-)
            [ -n "$ver" ] || continue
            tag="$card-$ver"
            if gh release view "$tag" >/dev/null 2>&1; then echo "✔ $tag już jest"; continue; fi
            title=$(head -1 "$dir/README.md" | sed -E 's/^# //; s/ – v[0-9.]+$//')
            awk -v v="## $ver" '$0==v{f=1;next} /^## v/{if(f)exit} f' "$log" > notes.md
            printf '\n---\n📂 [%s](https://github.com/%s/tree/main/%s) · 📝 [Pełna historia zmian](https://github.com/%s/blob/main/%s)\n' \
              "$dir" "$GITHUB_REPOSITORY" "$dir" "$GITHUB_REPOSITORY" "$log" >> notes.md
            gh release create "$tag" "$dir/$card.js" --target "$GITHUB_SHA" --title "$title $ver" --notes-file notes.md
            echo "🚀 $tag"
          done
